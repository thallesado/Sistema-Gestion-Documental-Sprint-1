name: nexodocs

services:
  postgres:
    image: postgres:17-alpine
    container_name: nexodocs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexodocs}
      POSTGRES_USER: ${POSTGRES_USER:-nexodocs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexodocs_dev}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - nexodocs_postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexodocs} -d ${POSTGRES_DB:-nexodocs}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-nexodocs}
      DB_USERNAME: ${POSTGRES_USER:-nexodocs}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET in .env}
      CORS_ALLOWED_ORIGINS: ${FRONTEND_URL:-http://localhost:4200}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
      STORAGE_LOCAL_PATH: /data/storage
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - nexodocs_document_storage:/data/storage
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/v3/api-docs >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-4200}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  nexodocs_postgres_data:
  nexodocs_document_storage:
