server:
  port: ${BACKEND_PORT:8080}
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:framework}

spring:
  application:
    name: nexodocs-backend
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:../../.env[.properties]

  jackson:
    serialization:
      write-dates-as-timestamps: false

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-lucky-dream-b436bm6l-pooler.c-6.us-east-2.aws.neon.tech:5432/neondb?sslmode=require}
    username: ${SPRING_DATASOURCE_USERNAME:neondb_owner}
    password: ${SPRING_DATASOURCE_PASSWORD:npg_k2zSxB3MPLEq}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # The schema is owned exclusively by versioned PostgreSQL migrations.
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    use-root-path: true
    operations-sorter: method
    tags-sorter: alpha

jwt:
  secret: ${JWT_SECRET:change-this-development-secret-at-least-32-bytes}
  expiration: ${JWT_EXPIRATION_MS:28800000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION_MS:604800000}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-at-least-32-bytes}
    expiration-ms: ${JWT_EXPIRATION_MS:28800000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost}
  rate-limit:
    login:
      max-attempts: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:5}
      window-seconds: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:60}
    public-tenants:
      max-requests: ${PUBLIC_TENANTS_RATE_LIMIT:10}
      window-seconds: ${PUBLIC_TENANTS_RATE_WINDOW_SECONDS:60}
  frontend-url: ${FRONTEND_URL:http://nexodocs-si2.duckdns.org}
  mail-from: ${MAIL_FROM:diegoastetepaz@gmail.com}
  password-recovery-expiration-minutes: ${PASSWORD_RECOVERY_EXPIRATION_MINUTES:30}
  storage:
    local-path: ${STORAGE_LOCAL_PATH:./data/storage}
  gemini:
    api-key: ${GEMINI_API_KEY:${gemini_api_key:${gemini.api-key:}}}
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
    timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:35}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    retry-delay-ms: ${GEMINI_RETRY_DELAY_MS:1000}
  assistant:
    rate-limit:
      max-requests: ${ASSISTANT_RATE_LIMIT_MAX_REQUESTS:20}
      window-seconds: ${ASSISTANT_RATE_LIMIT_WINDOW_SECONDS:60}
