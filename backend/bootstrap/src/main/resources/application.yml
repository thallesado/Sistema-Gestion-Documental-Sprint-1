server:
  port: ${BACKEND_PORT:8080}

spring:
  application:
    name: nexodocs-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5434/nexodocs}
    username: ${DB_USERNAME:nexodocs}
    password: ${DB_PASSWORD:nexodocs_dev}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    use-root-path: true
    operations-sorter: method
    tags-sorter: alpha

jwt:
  secret: ${JWT_SECRET:change-this-development-secret-at-least-32-bytes}
  expiration: ${JWT_EXPIRATION_MS:28800000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION_MS:604800000}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-at-least-32-bytes}
    expiration-ms: ${JWT_EXPIRATION_MS:28800000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  mail-from: ${MAIL_FROM:hello@demomailtrap.co}
  password-recovery-expiration-minutes: ${PASSWORD_RECOVERY_EXPIRATION_MINUTES:30}
  storage:
    local-path: ${STORAGE_LOCAL_PATH:./data/storage}
