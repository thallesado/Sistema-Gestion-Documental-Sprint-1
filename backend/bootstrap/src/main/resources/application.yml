server:
  port: ${BACKEND_PORT:8080}
  # none: no aceptar X-Forwarded-For de cualquier cliente. Detrás de Nginx de confianza, definir SERVER_FORWARD_HEADERS_STRATEGY=framework.
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}

spring:
  application:
    name: nexodocs-backend
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:../../.env[.properties]

  jackson:
    serialization:
      write-dates-as-timestamps: false

  datasource:
    # Local-only fallback: remote databases must always be explicitly configured.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/nexodocs}
    username: ${SPRING_DATASOURCE_USERNAME:nexodocs}
    password: ${SPRING_DATASOURCE_PASSWORD:nexodocs_dev}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # The schema is owned exclusively by versioned PostgreSQL migrations.
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          connectiontimeout: 10000
          timeout: 15000
          writetimeout: 15000
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    use-root-path: true
    operations-sorter: method
    tags-sorter: alpha

jwt:
  secret: ${JWT_SECRET:change-this-development-secret-at-least-32-bytes}
  expiration: ${JWT_EXPIRATION_MS:28800000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION_MS:604800000}

app:
  tenant-databases:
    routing-enabled: ${TENANT_DATABASE_ROUTING_ENABLED:false}
    isolation-enabled: ${TENANT_DATABASE_ISOLATION_ENABLED:false}
    provisioning-enabled: ${TENANT_DATABASE_PROVISIONING_ENABLED:false}
    admin-username: ${TENANT_DATABASE_ADMIN_USERNAME:}
    admin-password: ${TENANT_DATABASE_ADMIN_PASSWORD:}
    bootstrap-script: ${TENANT_DATABASE_BOOTSTRAP_SCRIPT:/app/migrations/tenant-bootstrap/migrate-tenant.sh}
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-at-least-32-bytes}
    expiration-ms: ${JWT_EXPIRATION_MS:28800000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost}
  rate-limit:
    login:
      max-attempts: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:5}
      window-seconds: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:60}
    public-tenants:
      max-requests: ${PUBLIC_TENANTS_RATE_LIMIT:10}
      window-seconds: ${PUBLIC_TENANTS_RATE_WINDOW_SECONDS:60}
    public-signup:
      max-requests: ${PUBLIC_SIGNUP_RATE_LIMIT:10}
      window-seconds: ${PUBLIC_SIGNUP_RATE_WINDOW_SECONDS:3600}
  frontend-url: ${FRONTEND_URL:http://nexodocs-si2.duckdns.org}
  mail-from: ${MAIL_FROM:diegoastetepaz@gmail.com}
  # Buzón que recibe el formulario público «Contáctanos»; vacío = el mismo MAIL_FROM.
  contact-email: ${CONTACT_EMAIL:}
  password-recovery-expiration-minutes: ${PASSWORD_RECOVERY_EXPIRATION_MINUTES:30}
  storage:
    local-path: ${STORAGE_LOCAL_PATH:./data/storage}
  gemini:
    api-key: ${GEMINI_API_KEY:${gemini_api_key:${gemini.api-key:}}}
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
    timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:35}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    retry-delay-ms: ${GEMINI_RETRY_DELAY_MS:1000}
  assistant:
    rate-limit:
      max-requests: ${ASSISTANT_RATE_LIMIT_MAX_REQUESTS:20}
      window-seconds: ${ASSISTANT_RATE_LIMIT_WINDOW_SECONDS:60}
  reportiq:
    api-url: ${REPORTIQ_API_URL:http://localhost:8001}
    frontend-url: ${REPORTIQ_FRONTEND_URL:http://localhost:3001}
    # Sin valor por defecto: sin REPORTIQ_API_KEY la vista ReportIQ responde 503.
    api-key: ${REPORTIQ_API_KEY:}

document-operations:
  intake-ocr-enabled: ${MAIL_INTAKE_OCR_ENABLED:false}
  worker-enabled: ${DOCUMENT_OPERATIONS_WORKER_ENABLED:true}
  poll-ms: ${DOCUMENT_OPERATIONS_POLL_MS:60000}
  initial-delay-ms: ${DOCUMENT_OPERATIONS_INITIAL_DELAY_MS:30000}
  key-file: ${DOCUMENT_OPERATIONS_KEY_FILE:${app.storage.local-path}/.operations/key}
  allow-insecure-local: ${DOCUMENT_OPERATIONS_ALLOW_INSECURE_LOCAL:false}
  mail-profiles: ${MAILBOX_PROFILES_JSON:{}}
  clamav-host: ${CLAMAV_HOST:}
  clamav-port: ${CLAMAV_PORT:3310}

# Anclaje externo de la cadena de auditoria (C3). Sin destino configurado el job queda DISABLED.
nexodocs:
  # Avisos push (FCM). Sin credenciales el servicio queda desactivado; ver .env.example.
  push:
    firebase:
      credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
      credentials-json: ${FIREBASE_CREDENTIALS_JSON:}
  audit:
    # Sin AUDIT_ANCHOR_SECRET se genera una clave aleatoria en AUDIT_ANCHOR_KEY_FILE (por defecto junto al archivo de anclas).
    anchor-secret: ${AUDIT_ANCHOR_SECRET:}
    anchor-key-file: ${AUDIT_ANCHOR_KEY_FILE:}
    external-anchor:
      file-path: ${AUDIT_ANCHOR_EXTERNAL_FILE:}
      cron: ${AUDIT_ANCHOR_CRON:0 */15 * * * *}
      http:
        url: ${AUDIT_ANCHOR_EXTERNAL_HTTP_URL:}
        read-url: ${AUDIT_ANCHOR_EXTERNAL_HTTP_READ_URL:}
        method: ${AUDIT_ANCHOR_EXTERNAL_HTTP_METHOD:POST}
        auth-header: ${AUDIT_ANCHOR_EXTERNAL_HTTP_AUTH_HEADER:}
        timeout-ms: ${AUDIT_ANCHOR_EXTERNAL_HTTP_TIMEOUT_MS:5000}

