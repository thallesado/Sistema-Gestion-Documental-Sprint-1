# Restricted or secret Stripe API key. Set STRIPE_API_KEY in the deployment environment.
# Never place a live Stripe secret in source control.
app.stripe.api-key=${STRIPE_API_KEY:rk_test_REPLACE_WITH_YOUR_KEY}
app.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:whsec_REPLACE_WITH_YOUR_WEBHOOK_SECRET}
# Recurring Stripe Prices (price_...) per plan and cycle. A plan without a price cannot be bought.
app.stripe.prices.basic-monthly=${STRIPE_PRICE_BASIC_MONTHLY:}
app.stripe.prices.basic-annual=${STRIPE_PRICE_BASIC_ANNUAL:}
app.stripe.prices.pro-monthly=${STRIPE_PRICE_PRO_MONTHLY:}
app.stripe.prices.pro-annual=${STRIPE_PRICE_PRO_ANNUAL:}
app.stripe.prices.enterprise-monthly=${STRIPE_PRICE_ENTERPRISE_MONTHLY:}
app.stripe.prices.enterprise-annual=${STRIPE_PRICE_ENTERPRISE_ANNUAL:}
# Estimated processing costs shown in the platform dashboard (percent of each payment + fixed USD).
app.billing.fees.stripe-card-percent=${FEE_STRIPE_CARD_PERCENT:2.9}
app.billing.fees.stripe-card-fixed=${FEE_STRIPE_CARD_FIXED:0.30}
app.billing.fees.bank-qr-percent=${FEE_BANK_QR_PERCENT:0}
app.billing.fees.crypto-usdt-percent=${FEE_CRYPTO_USDT_PERCENT:1.0}
