spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gestdocum}
    username: ${DB_USER:gestdocum_user}
    password: ${DB_PASSWORD:gestdocum_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.lta.gestdocum: DEBUG
    org.springframework.security: INFO
