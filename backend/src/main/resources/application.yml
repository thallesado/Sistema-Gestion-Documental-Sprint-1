server:
  port: 8080

spring:
  application:
    name: nexodocs-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/nexodocs}
    username: ${DB_USERNAME:nexodocs}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  ai:
    google:
      genai:
        api-key: ${GOOGLE_API_KEY}
        chat:
          options:
            model: "gemini-3.5-flash-lite"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    use-root-path: true
    operations-sorter: method
    tags-sorter: alpha

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION_MS:28800000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}