server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Las fotos de camara y los PDF escaneados superan el limite por defecto (1 MB);
    # el backend acepta hasta 26 MB por solicitud multipart.
    client_max_body_size 26m;

    location /api/ {
        # El OCR puede probar varios modelos de Gemini; el limite por defecto (60 s) cortaba la solicitud.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # Sin la barra final se conserva el prefijo /api/ de la solicitud.
        # Ej.: /api/v1/auth/login -> http://backend:8080/api/v1/auth/login
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
