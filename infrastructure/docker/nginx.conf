server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;

    # index.html siempre se revalida: si el navegador lo cachea, sigue cargando
    # los bundles del despliegue anterior y no se ven los cambios.
    location / {
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Los bundles de Angular llevan hash en el nombre (main-CQIM2QKV.js): pueden
    # cachearse indefinidamente. Los archivos de public/ no tienen hash y quedan fuera.
    location ~ "-[A-Z0-9]{8}\.(?:js|css|woff2?|ttf|svg|png|jpe?g|webp)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Las fotos de camara y los PDF escaneados superan el limite por defecto (1 MB);
    # el backend acepta hasta 26 MB por solicitud multipart.
    client_max_body_size 26m;

    location /api/ {
        # El OCR puede probar varios modelos de Gemini; el limite por defecto (60 s) cortaba la solicitud.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # Sin la barra final se conserva el prefijo /api/ de la solicitud.
        # Ej.: /api/v1/auth/login -> http://backend:8080/api/v1/auth/login
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
