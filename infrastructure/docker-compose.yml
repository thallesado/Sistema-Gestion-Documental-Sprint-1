services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexodocs}
      POSTGRES_USER: ${POSTGRES_USER:-nexodocs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexodocs_dev}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - nexodocs_postgres_data:/var/lib/postgresql/data
      - ../database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexodocs} -d ${POSTGRES_DB:-nexodocs}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ..
      dockerfile: infrastructure/docker/migrations.Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-nexodocs}
      PGUSER: ${POSTGRES_USER:-nexodocs}
      PGPASSWORD: ${POSTGRES_PASSWORD:-nexodocs_dev}

  backend:
    build:
      context: ..
      dockerfile: infrastructure/docker/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-nexodocs}
      DB_USER: ${POSTGRES_USER:-nexodocs}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-nexodocs_dev}
      JWT_SECRET: ${JWT_SECRET:-change-this-development-secret-at-least-32-bytes}
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost}"
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
      STORAGE_LOCAL_PATH: /data/storage
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}
      MAIL_FROM: ${MAIL_FROM:-diegoastetepaz@gmail.com}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-35}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-rk_test_REPLACE_WITH_YOUR_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_REPLACE_WITH_YOUR_WEBHOOK_SECRET}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - nexodocs_document_storage:/data/storage

  frontend:
    build:
      context: ..
      dockerfile: infrastructure/docker/frontend.Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      - backend

volumes:
  nexodocs_postgres_data:
  nexodocs_document_storage:
